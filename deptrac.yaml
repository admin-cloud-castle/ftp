deptrac:
  paths:
    - ./src
    - ./tests
  layers:
    - name: Contract
      collectors:
        - type: classLike
          value: CloudCastle\\Ftp\\Contract\\.*
    - name: Exception
      collectors:
        - type: classLike
          value: CloudCastle\\Ftp\\Exception\\.*
    - name: Core
      collectors:
        - type: classLike
          value: CloudCastle\\Ftp\\(?!Contract\\|Exception\\|Tests\\).*
    - name: Tests
      collectors:
        - type: classLike
          value: CloudCastle\\Ftp\\Tests\\.*
  ruleset:
    Contract: []
    Exception:
      - Exception
    Core:
      - Contract
      - Exception
    Tests:
      - Contract
      - Exception
      - Core
